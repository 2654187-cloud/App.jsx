<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יומן ניהול לו"ז משפחתי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://thnfcunjgodtkuugbfg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FIo2bDyuizlE6cPf9HzMkw_r621ajwI';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const HEBREW_MONTHS = [
      'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
      'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'
    ];

    function CalendarApp() {
      const [currentDate, setCurrentDate] = React.useState(new Date());
      const [viewMode, setViewMode] = React.useState('month');
      const [events, setEvents] = React.useState([]);
      const [selectedDateEvents, setSelectedDateEvents] = React.useState(null);
      const [isModalOpen, setIsModalOpen] = React.useState(false);

      // Form state
      const [editingEventId, setEditingEventId] = React.useState(null);
      const [title, setTitle] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [location, setLocation] = React.useState('');
      const [dateStr, setDateStr] = React.useState('');
      const [startTime, setStartTime] = React.useState('10:00');
      const [endTime, setEndTime] = React.useState('11:00');
      const [isAllDay, setIsAllDay] = React.useState(false);
      const [owner, setOwner] = React.useState('דודי');

      React.useEffect(() => {
        fetchEvents();
      }, []);

      const fetchEvents = async () => {
        try {
          const { data, error } = await supabase.from('events').select('*');
          if (!error && data) {
            setEvents(data);
          }
        } catch (err) {
          console.error('Error fetching events:', err);
        }
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        const payload = {
          title,
          description,
          location,
          date: dateStr,
          time: isAllDay ? 'כל היום' : startTime,
          end_time: isAllDay ? null : endTime,
          owner,
          is_completed: false
        };

        if (editingEventId) {
          const { error } = await supabase.from('events').update(payload).eq('id', editingEventId);
          if (error) alert('שגיאה בעדכון: ' + error.message);
          else { fetchEvents(); closeModal(); }
        } else {
          const { error } = await supabase.from('events').insert([payload]);
          if (error) alert('שגיאה בשמירה: ' + error.message);
          else { fetchEvents(); closeModal(); }
        }
      };

      const handleDeleteEvent = async (id) => {
        if (confirm('האם למחוק אירוע זה?')) {
          const { error } = await supabase.from('events').delete().eq('id', id);
          if (!error) {
            fetchEvents();
            if (selectedDateEvents) {
              setSelectedDateEvents(prev => ({
                ...prev,
                events: prev.events.filter(e => e.id !== id)
              }));
            }
          }
        }
      };

      const openModalForNew = (defaultDate = '') => {
        setEditingEventId(null);
        setTitle('');
        setDescription('');
        setLocation('');
        setDateStr(defaultDate || new Date().toISOString().split('T')[0]);
        setStartTime('10:00');
        setEndTime('11:00');
        setIsAllDay(false);
        setOwner('דודי');
        setIsModalOpen(true);
      };

      const openModalForEdit = (ev) => {
        setEditingEventId(ev.id);
        setTitle(ev.title || '');
        setDescription(ev.description || '');
        setLocation(ev.location || '');
        setDateStr(ev.date || '');
        if (ev.time === 'כל היום') {
          setIsAllDay(true);
          setStartTime('10:00');
          setEndTime('11:00');
        } else {
          setIsAllDay(false);
          setStartTime(ev.time || '10:00');
          setEndTime(ev.end_time || '11:00');
        }
        setOwner(ev.owner || 'דודי');
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingEventId(null);
      };

      const todayStr = new Date().toISOString().split('T')[0];

      const handleMonthChange = (e) => {
        const newMonth = parseInt(e.target.value, 10);
        const next = new Date(currentDate);
        next.setMonth(newMonth);
        setCurrentDate(next);
      };

      const handleYearChange = (e) => {
        const newYear = parseInt(e.target.value, 10);
        const next = new Date(currentDate);
        next.setFullYear(newYear);
        setCurrentDate(next);
      };

      const getWeekDays = () => {
        const start = new Date(currentDate);
        const dayOfWeek = start.getDay();
        start.setDate(start.getDate() - dayOfWeek);

        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          return d;
        });
      };

      const getDaysInMonthGrid = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        const grid = [];
        for (let i = 0; i < firstDay; i++) grid.push(null);
        for (let day = 1; day <= totalDays; day++) {
          const formattedMonth = String(month + 1).padStart(2, '0');
          const formattedDay = String(day).padStart(2, '0');
          const dStr = `${year}-${formattedMonth}-${formattedDay}`;
          grid.push({ day, dStr });
        }
        return grid;
      };

      const renderDayTimeline = (targetDateStr) => {
        const dayEvs = events.filter(e => e.date === targetDateStr);
        const allDayEvs = dayEvs.filter(e => e.time === 'כל היום' || !e.time);
        const timedEvs = dayEvs.filter(e => e.time && e.time !== 'כל היום');
        const hours = Array.from({ length: 24 }, (_, i) => i);

        return (
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div className="text-center mb-4 pb-3 border-b border-slate-100">
              <h3 className="font-black text-xl text-slate-800">ציר זמן יומי ל-{targetDateStr}</h3>
            </div>

            {allDayEvs.length > 0 && (
              <div className="mb-4 bg-amber-50/70 border border-amber-200 rounded-xl p-3">
                <span className="text-xs font-bold text-amber-800 block mb-2">אירועים לכל היום:</span>
                <div className="space-y-1.5">
                  {allDayEvs.map(ev => (
                    <div key={ev.id} className="bg-white border-r-4 border-amber-500 p-3 rounded-lg shadow-sm flex justify-between items-start">
                      <div>
                        <div className="font-bold text-slate-800">{ev.title}</div>
                        {ev.description && <div className="text-xs text-slate-600 mt-1">{ev.description}</div>}
                        {ev.location && (
                          <div className="text-xs text-indigo-600 mt-1 font-medium flex items-center gap-1">
                            <i className="fa-solid fa-location-dot"></i>
                            <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}`} target="_blank" rel="noreferrer" className="hover:underline">
                              {ev.location}
                            </a>
                          </div>
                        )}
                        <div className="text-[11px] text-slate-400 mt-0.5">משויך ל: {ev.owner}</div>
                      </div>
                      <div className="flex space-x-2 space-x-reverse text-slate-400">
                        <button onClick={() => openModalForEdit(ev)} className="hover:text-indigo-600"><i className="fa-solid fa-pen"></i></button>
                        <button onClick={() => handleDeleteEvent(ev.id)} className="hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="space-y-1 max-h-[550px] overflow-y-auto pr-1">
              {hours.map(hourNum => {
                const hourPrefix = String(hourNum).padStart(2, '0');
                const hourEvs = timedEvs.filter(e => e.time && e.time.startsWith(hourPrefix));

                return (
                  <div key={hourNum} className="flex border-b border-slate-100 py-2.5 min-h-[55px] items-start">
                    <div className="w-16 font-mono text-xs font-bold text-slate-400 pt-1">
                      {hourPrefix}:00
                    </div>
                    <div className="flex-1 space-y-2">
                      {hourEvs.map(ev => (
                        <div key={ev.id} className="bg-indigo-50/80 border-r-4 border-indigo-600 p-3 rounded-xl shadow-sm flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-xs font-bold bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded-md">
                                {ev.time} {ev.end_time ? `- ${ev.end_time}` : ''}
                              </span>
                              <span className="font-bold text-slate-800 text-sm">{ev.title}</span>
                              <span className="text-xs text-slate-500">({ev.owner})</span>
                            </div>
                            {ev.description && (
                              <p className="text-xs text-slate-600 mr-1 leading-relaxed mb-1">{ev.description}</p>
                            )}
                            {ev.location && (
                              <div className="text-xs text-indigo-600 font-medium flex items-center gap-1">
                                <i className="fa-solid fa-location-dot"></i>
                                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}`} target="_blank" rel="noreferrer" className="hover:underline">
                                  {ev.location}
                                </a>
                              </div>
                            )}
                          </div>
                          <div className="flex space-x-2 space-x-reverse text-slate-400">
                            <button onClick={() => openModalForEdit(ev)} className="hover:text-indigo-600"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => handleDeleteEvent(ev.id)} className="hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const yearsList = Array.from({ length: 7 }, (_, i) => 2024 + i);

      return (
        <div className="max-w-5xl mx-auto p-4">
          <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6 flex flex-col items-center text-center gap-4">
            <div className="flex items-center space-x-3 space-x-reverse justify-center">
              <h1 className="text-2xl font-black text-indigo-900"><i className="fa-regular fa-calendar-days text-indigo-600 ml-2"></i>יומן ניהול לו"ז משפחתי</h1>
            </div>
            
            <div className="flex items-center gap-3 bg-indigo-50/70 border border-indigo-100 px-4 py-2 rounded-2xl">
              <select 
                value={currentDate.getMonth()} 
                onChange={handleMonthChange}
                className="bg-white text-indigo-900 font-bold text-sm px-3 py-1.5 rounded-xl border border-indigo-200 outline-none cursor-pointer"
              >
                {HEBREW_MONTHS.map((m, idx) => (
                  <option key={idx} value={idx}>{m}</option>
                ))}
              </select>

              <select 
                value={currentDate.getFullYear()} 
                onChange={handleYearChange}
                className="bg-white text-indigo-900 font-bold text-sm px-3 py-1.5 rounded-xl border border-indigo-200 outline-none cursor-pointer"
              >
                {yearsList.map(y => (
                  <option key={y} value={y}>{y}</option>
                ))}
              </select>

              <button 
                onClick={() => setCurrentDate(new Date())} 
                className="text-xs font-bold text-indigo-600 px-3 py-1.5 bg-white border border-indigo-200 rounded-xl hover:bg-indigo-100 transition"
              >
                חזור להיום
              </button>
            </div>

            <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold border border-slate-200">
              <button 
                onClick={() => setViewMode('month')} 
                className={`px-4 py-2 rounded-lg transition ${viewMode === 'month' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                תצוגה חודשית
              </button>
              <button 
                onClick={() => setViewMode('week')} 
                className={`px-4 py-2 rounded-lg transition ${viewMode === 'week' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                תצוגה שבועית
              </button>
              <button 
                onClick={() => setViewMode('day')} 
                className={`px-4 py-2 rounded-lg transition ${viewMode === 'day' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                תצוגה יומית
              </button>
            </div>

            <div>
              <button 
                onClick={() => openModalForNew()}
                className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl transition shadow-sm"
              >
                + אירוע חדש
              </button>
            </div>
          </header>

          {/* Daily View */}
          {viewMode === 'day' && renderDayTimeline(currentDate.toISOString().split('T')[0])}

          {/* Weekly View */}
          {viewMode === 'week' && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
              <div className="grid grid-cols-7 gap-2 text-center font-bold text-xs text-slate-500 mb-2">
                <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
              </div>
              <div className="grid grid-cols-7 gap-2">
                {getWeekDays().map((d, idx) => {
                  const dStr = d.toISOString().split('T')[0];
                  const isToday = dStr === todayStr;
                  const dayEvents = events.filter(e => e.date === dStr);

                  return (
                    <div 
                      key={idx}
                      onClick={() => setSelectedDateEvents({ date: dStr, events: dayEvents })}
                      className={`border min-h-[140px] p-2 rounded-xl cursor-pointer transition flex flex-col justify-between ${
                        isToday 
                          ? 'bg-indigo-50/80 border-indigo-500 ring-2 ring-indigo-400' 
                          : 'border-slate-200 hover:border-indigo-300 bg-white'
                      }`}
                    >
                      <div className="flex justify-between items-center mb-1">
                        <span className={`text-xs font-black ${isToday ? 'bg-indigo-600 text-white px-2 py-0.5 rounded-full' : 'text-slate-600'}`}>
                          {d.getDate()}
                        </span>
                      </div>
                      <div className="space-y-1 overflow-y-auto max-h-[100px]">
                        {dayEvents.map(ev => (
                          <div key={ev.id} className="text-[11px] bg-indigo-100/70 text-indigo-900 font-semibold p-1.5 rounded-lg truncate">
                            {ev.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Monthly View */}
          {viewMode === 'month' && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
              <div className="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 mb-2">
                <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
              </div>
              <div className="grid grid-cols-7 gap-1">
                {getDaysInMonthGrid().map((cell, i) => {
                  if (!cell) return <div key={`empty-${i}`} className="min-h-[85px] bg-slate-50/50 rounded-xl border border-transparent"></div>;

                  const { day, dStr } = cell;
                  const isToday = dStr === todayStr;
                  const dayEvents = events.filter(e => e.date === dStr);

                  return (
                    <div 
                      key={dStr} 
                      onClick={() => setSelectedDateEvents({ date: dStr, events: dayEvents })}
                      className={`border min-h-[85px] p-1.5 rounded-xl cursor-pointer transition flex flex-col justify-between ${
                        isToday 
                          ? 'bg-indigo-50/90 border-indigo-500 ring-2 ring-indigo-400' 
                          : 'border-slate-100 hover:border-indigo-300 bg-white'
                      }`}
                    >
                      <span className={`text-xs font-bold ${isToday ? 'bg-indigo-600 text-white px-1.5 py-0.5 rounded-full self-start' : 'text-slate-500'}`}>
                        {day}
                      </span>
                      <div className="space-y-1">
                        {dayEvents.slice(0, 2).map(ev => (
                          <div key={ev.id} className="text-[10px] bg-indigo-100/80 text-indigo-900 font-medium p-1 rounded truncate">
                            {ev.title}
                          </div>
                        ))}
                        {dayEvents.length > 2 && (
                          <span className="text-[9px] text-slate-400 font-bold block">+ עוד {dayEvents.length - 2}</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Selected Date Modal */}
          {selectedDateEvents && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-5">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="font-bold text-lg text-slate-800">אירועים ל-{selectedDateEvents.date}</h3>
                  <button onClick={() => setSelectedDateEvents(null)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                {renderDayTimeline(selectedDateEvents.date)}
              </div>
            </div>
          )}

          {/* Add / Edit Event Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg text-slate-800">{editingEventId ? 'עריכת אירוע' : 'אירוע חדש'}</h3>
                  <button onClick={closeModal} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onSubmit={handleSaveEvent} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">כותרת האירוע *</label>
                    <input 
                      type="text" 
                      placeholder="הכנס כותרת..." 
                      value={title} 
                      onChange={e => setTitle(e.target.value)} 
                      required 
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">תיאור (אופציונלי)</label>
                    <textarea 
                      placeholder="פירוט או הערות נוספות..." 
                      value={description} 
                      onChange={e => setDescription(e.target.value)} 
                      rows="2"
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 resize-none"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">כתובת / מיקום</label>
                    <input 
                      type="text" 
                      placeholder="הכנס כתובת או שם המקום..." 
                      value={location} 
                      onChange={e => setLocation(e.target.value)} 
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">תאריך *</label>
                    <input 
                      type="date" 
                      value={dateStr} 
                      onChange={e => setDateStr(e.target.value)} 
                      required 
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none"
                    />
                  </div>

                  <label className="flex items-center space-x-2 space-x-reverse text-sm font-semibold text-slate-600 cursor-pointer">
                    <input 
                      type="checkbox" 
                      checked={isAllDay} 
                      onChange={e => setIsAllDay(e.target.checked)} 
                      className="rounded text-indigo-600"
                    />
                    <span>אירוע לכל היום</span>
                  </label>

                  {!isAllDay && (
                    <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">משעה</label>
                        <input 
                          type="time" 
                          value={startTime} 
                          onChange={e => setStartTime(e.target.value)} 
                          className="w-full border border-slate-200 rounded-xl p-2 text-sm outline-none bg-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">עד שעה</label>
                        <input 
                          type="time" 
                          value={endTime} 
                          onChange={e => setEndTime(e.target.value)} 
                          className="w-full border border-slate-200 rounded-xl p-2 text-sm outline-none bg-white"
                        />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">משויך ל:</label>
                    <select 
                      value={owner} 
                      onChange={e => setOwner(e.target.value)}
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none"
                    >
                      <option value="דודי">דודי</option>
                      <option value="שיינדי">שיינדי</option>
                      <option value="כללי">משותף</option>
                    </select>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-sm"
                  >
                    שמור אירוע
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CalendarApp />);
  </script>
</body>
</html>
