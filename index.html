<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://thnfcunjgodtkcuugbfg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FIo2bDyuizlE6cPf9HzMkw_r621ajwI';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const HEBREW_MONTHS = [
      'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
      'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'
    ];

    const YEARS = Array.from({ length: 7 }, (_, i) => 2024 + i);

    // כלים לתמיכה בלוח העברי (מבוססים על ספריית hebcal הטעונה גלובלית)
    const TISHREI = 7;

    const HEBREW_MONTH_NAMES = {
      'Nisan': 'ניסן', 'Iyyar': 'אייר', 'Sivan': 'סיוון', 'Tamuz': 'תמוז',
      'Av': 'אב', 'Elul': 'אלול', 'Tishrei': 'תשרי', 'Cheshvan': 'חשוון',
      'Kislev': 'כסלו', 'Tevet': 'טבת', "Sh'vat": 'שבט', 'Adar': 'אדר',
      'Adar I': 'אדר א׳', 'Adar II': 'אדר ב׳'
    };

    // כינויי הימים בגימטרייה נהוגה (ט"ו/ט"ז במקום י"ה/י"ו)
    const HEBREW_DAY_NUMERALS = {
      1: 'א׳', 2: 'ב׳', 3: 'ג׳', 4: 'ד׳', 5: 'ה׳', 6: 'ו׳', 7: 'ז׳', 8: 'ח׳', 9: 'ט׳', 10: 'י׳',
      11: 'י״א', 12: 'י״ב', 13: 'י״ג', 14: 'י״ד', 15: 'ט״ו', 16: 'ט״ז', 17: 'י״ז', 18: 'י״ח', 19: 'י״ט', 20: 'כ׳',
      21: 'כ״א', 22: 'כ״ב', 23: 'כ״ג', 24: 'כ״ד', 25: 'כ״ה', 26: 'כ״ו', 27: 'כ״ז', 28: 'כ״ח', 29: 'כ״ט', 30: 'ל׳'
    };

    const HEBREW_YEAR_MIN = new hebcal.HDate(new Date(YEARS[0], 0, 1)).getFullYear();
    const HEBREW_YEAR_MAX = new hebcal.HDate(new Date(YEARS[YEARS.length - 1], 11, 31)).getFullYear();
    const HEBREW_YEARS = Array.from({ length: HEBREW_YEAR_MAX - HEBREW_YEAR_MIN + 1 }, (_, i) => HEBREW_YEAR_MIN + i);

    function hebrewDayNumeral(day) {
      return HEBREW_DAY_NUMERALS[day] || String(day);
    }

    function hebrewMonthLabel(monthNum, hyear) {
      const name = hebcal.HDate.getMonthName(monthNum, hyear);
      return HEBREW_MONTH_NAMES[name] || name;
    }

    // ייצוג השנה העברית בגימטרייה תקנית (למשל 5786 -> תשפ"ו)
    function hebrewYearLabel(hyear) {
      const rendered = new hebcal.HDate(1, TISHREI, hyear).renderGematriya(true, false);
      const parts = rendered.trim().split(' ');
      return parts[parts.length - 1];
    }

    // סדר כרונולוגי של חודשי השנה העברית (מתשרי, לא ממספר 1)
    function getChronologicalHebrewMonths(hyear) {
      const monthsInYear = hebcal.HDate.monthsInYear(hyear);
      const monthsList = [];
      for (let m = TISHREI; m <= monthsInYear; m++) monthsList.push(m);
      for (let m = 1; m < TISHREI; m++) monthsList.push(m);
      return monthsList;
    }

    function formatIsoDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatGregorianShort(dateObj) {
      return `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatGregorianFull(dateObj) {
      return `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
    }

    // תוויות תאריך מלאות (עברי + לועזי) לפי תאריך יומי, בהתאם למערכת הלוח הראשית
    function getDualDateLabels(dateObj, calendarSystem) {
      const hd = new hebcal.HDate(dateObj);
      const gregorianLabel = formatGregorianFull(dateObj);
      const hebrewLabel = hd.renderGematriya(true, false);
      return calendarSystem === 'hebrew'
        ? { primary: hebrewLabel, secondary: gregorianLabel }
        : { primary: gregorianLabel, secondary: hebrewLabel };
    }

    // הגדרת צבעים ייחודיים ומפורטים לכל משתמש
    const OWNER_COLORS = {
      'דודי': {
        bg: 'bg-emerald-500',
        dot: 'bg-emerald-500',
        cardLight: 'bg-emerald-50/80 border-emerald-200 text-emerald-950',
        cardDark: 'bg-emerald-950/40 border-emerald-800/60 text-emerald-100',
        badgeLight: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        badgeDark: 'bg-emerald-900/80 text-emerald-200 border-emerald-700'
      },
      'שיינדי': {
        bg: 'bg-rose-500',
        dot: 'bg-rose-500',
        cardLight: 'bg-rose-50/80 border-rose-200 text-rose-950',
        cardDark: 'bg-rose-950/40 border-rose-800/60 text-rose-100',
        badgeLight: 'bg-rose-100 text-rose-800 border-rose-300',
        badgeDark: 'bg-rose-900/80 text-rose-200 border-rose-700'
      },
      'משותף': {
        bg: 'bg-indigo-500',
        dot: 'bg-indigo-500',
        cardLight: 'bg-indigo-50/80 border-indigo-200 text-indigo-950',
        cardDark: 'bg-indigo-950/40 border-indigo-800/60 text-indigo-100',
        badgeLight: 'bg-indigo-100 text-indigo-800 border-indigo-300',
        badgeDark: 'bg-indigo-900/80 text-indigo-200 border-indigo-700'
      },
      'כללי': {
        bg: 'bg-indigo-500',
        dot: 'bg-indigo-500',
        cardLight: 'bg-indigo-50/80 border-indigo-200 text-indigo-950',
        cardDark: 'bg-indigo-950/40 border-indigo-800/60 text-indigo-100',
        badgeLight: 'bg-indigo-100 text-indigo-800 border-indigo-300',
        badgeDark: 'bg-indigo-900/80 text-indigo-200 border-indigo-700'
      }
    };

    function CalendarApp() {
      // טעינת תצוגת הנושא שנשמרה בזיכרון המכשיר (ברירת מחדל: כהה)
      const [isDarkMode, setIsDarkMode] = React.useState(() => {
        const savedTheme = localStorage.getItem('app_theme');
        return savedTheme ? savedTheme === 'dark' : true;
      });

      // סוג הלוח הראשי המוצג: 'gregorian' (לועזי) או 'hebrew' (עברי)
      const [calendarSystem, setCalendarSystem] = React.useState(() => {
        const saved = localStorage.getItem('app_calendar_system');
        return saved === 'hebrew' ? 'hebrew' : 'gregorian';
      });

      const [currentDate, setCurrentDate] = React.useState(new Date());
      const [viewMode, setViewMode] = React.useState('month');
      const [filterOwner, setFilterOwner] = React.useState('הכול');
      const [events, setEvents] = React.useState([]);
      const [selectedDateEvents, setSelectedDateEvents] = React.useState(null);
      const [isModalOpen, setIsModalOpen] = React.useState(false);

      const [editingEventId, setEditingEventId] = React.useState(null);
      const [title, setTitle] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [location, setLocation] = React.useState('');
      const [dateStr, setDateStr] = React.useState('');
      const [startTime, setStartTime] = React.useState('10:00');
      const [endTime, setEndTime] = React.useState('11:00');
      const [isAllDay, setIsAllDay] = React.useState(false);
      const [owner, setOwner] = React.useState('דודי');

      const todayStr = formatIsoDate(new Date());

      // שמירת הבחירה של התצוגה בזיכרון המכשיר בלחיצה
      const toggleTheme = () => {
        setIsDarkMode(prev => {
          const next = !prev;
          localStorage.setItem('app_theme', next ? 'dark' : 'light');
          return next;
        });
      };

      const toggleCalendarSystem = () => {
        setCalendarSystem(prev => {
          const next = prev === 'gregorian' ? 'hebrew' : 'gregorian';
          localStorage.setItem('app_calendar_system', next);
          return next;
        });
      };

      // פרשות שבוע וחגים לכל טווח השנים הנתמך, מחושב פעם אחת (לוח ישראל)
      const hebrewCalendarInfo = React.useMemo(() => {
        const map = {};
        try {
          const calEvents = hebcal.HebrewCalendar.calendar({
            start: new Date(YEARS[0], 0, 1),
            end: new Date(YEARS[YEARS.length - 1], 11, 31),
            sedrot: true,
            il: true,
            noHolidays: false,
            candlelighting: false
          });
          calEvents.forEach(ev => {
            const dStr = formatIsoDate(ev.getDate().greg());
            const isParsha = typeof ev.getCategories === 'function' && ev.getCategories().includes('parashat');
            const label = ev.render('he-x-NoNikud');
            if (!map[dStr]) map[dStr] = { parsha: null, holidays: [] };
            if (isParsha) {
              map[dStr].parsha = label;
            } else {
              map[dStr].holidays.push(label);
            }
          });
        } catch (err) {
          console.error('Error computing hebrew calendar info:', err);
        }
        return map;
      }, []);

      React.useEffect(() => {
        fetchEvents();
      }, []);

      const fetchEvents = async () => {
        try {
          const { data, error } = await supabase.from('events').select('*');
          if (!error && data) {
            setEvents(data);
          }
        } catch (err) {
          console.error('Error fetching events:', err);
        }
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        const payload = {
          title,
          description,
          location,
          date: dateStr,
          time: isAllDay ? 'כל היום' : startTime,
          end_time: isAllDay ? null : endTime,
          owner,
          is_completed: false
        };

        if (editingEventId) {
          const { error } = await supabase.from('events').update(payload).eq('id', editingEventId);
          if (error) alert('שגיאה בעדכון: ' + error.message);
          else { fetchEvents(); closeModal(); }
        } else {
          const { error } = await supabase.from('events').insert([payload]);
          if (error) alert('שגיאה בשמירה: ' + error.message);
          else { fetchEvents(); closeModal(); }
        }
      };

      const handleDeleteEvent = async (id) => {
        if (confirm('האם למחוק אירוע זה?')) {
          const { error } = await supabase.from('events').delete().eq('id', id);
          if (!error) {
            fetchEvents();
          }
        }
      };

      const openModalForNew = (defaultDate = '') => {
        setEditingEventId(null);
        setTitle('');
        setDescription('');
        setLocation('');
        setDateStr(defaultDate || formatIsoDate(new Date()));
        setStartTime('10:00');
        setEndTime('11:00');
        setIsAllDay(false);
        setOwner('דודי');
        setIsModalOpen(true);
      };

      const openModalForEdit = (ev) => {
        setEditingEventId(ev.id);
        setTitle(ev.title || '');
        setDescription(ev.description || '');
        setLocation(ev.location || '');
        setDateStr(ev.date || '');
        if (ev.time === 'כל היום') {
          setIsAllDay(true);
          setStartTime('10:00');
          setEndTime('11:00');
        } else {
          setIsAllDay(false);
          setStartTime(ev.time || '10:00');
          setEndTime(ev.end_time || '11:00');
        }
        setOwner(ev.owner === 'כללי' ? 'משותף' : (ev.owner || 'דודי'));
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingEventId(null);
      };

      const handleGoToToday = () => {
        const now = new Date();
        setCurrentDate(now);
        setSelectedDateEvents({ date: todayStr });
      };

      const handleNavigateTime = (direction) => {
        if (calendarSystem === 'hebrew' && viewMode === 'month') {
          const hd = new hebcal.HDate(currentDate);
          const firstOfMonth = new hebcal.HDate(1, hd.getMonth(), hd.getFullYear());
          setCurrentDate(firstOfMonth.add(direction, 'month').greg());
          return;
        }
        const next = new Date(currentDate);
        if (viewMode === 'month') {
          next.setMonth(next.getMonth() + direction);
        } else if (viewMode === 'week') {
          next.setDate(next.getDate() + (direction * 7));
        } else if (viewMode === 'day') {
          next.setDate(next.getDate() + direction);
        }
        setCurrentDate(next);
      };

      const handleMonthSelect = (e) => {
        const next = new Date(currentDate);
        next.setMonth(parseInt(e.target.value, 10));
        setCurrentDate(next);
      };

      const handleYearSelect = (e) => {
        const next = new Date(currentDate);
        next.setFullYear(parseInt(e.target.value, 10));
        setCurrentDate(next);
      };

      const handleHebrewMonthSelect = (e) => {
        const hd = new hebcal.HDate(currentDate);
        const newMonth = parseInt(e.target.value, 10);
        setCurrentDate(new hebcal.HDate(1, newMonth, hd.getFullYear()).greg());
      };

      const handleHebrewYearSelect = (e) => {
        const hd = new hebcal.HDate(currentDate);
        const newYear = parseInt(e.target.value, 10);
        const monthsInNewYear = hebcal.HDate.monthsInYear(newYear);
        const safeMonth = Math.min(hd.getMonth(), monthsInNewYear);
        setCurrentDate(new hebcal.HDate(1, safeMonth, newYear).greg());
      };

      const filteredEvents = events.filter(e => {
        if (filterOwner === 'הכול') return true;
        if (filterOwner === 'משותף') return e.owner === 'משותף' || e.owner === 'כללי';
        return e.owner === filterOwner;
      });

      const getWeekDays = () => {
        const start = new Date(currentDate);
        const dayOfWeek = start.getDay();
        start.setDate(start.getDate() - dayOfWeek);

        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          return d;
        });
      };

      const getDaysInMonthGrid = () => {
        if (calendarSystem === 'hebrew') {
          const hd = new hebcal.HDate(currentDate);
          const hyear = hd.getFullYear();
          const hmonth = hd.getMonth();
          const daysInMonth = hebcal.HDate.daysInMonth(hmonth, hyear);
          const firstHDate = new hebcal.HDate(1, hmonth, hyear);
          const firstDayOfWeek = firstHDate.greg().getDay();

          const grid = [];
          for (let i = 0; i < firstDayOfWeek; i++) grid.push(null);
          for (let day = 1; day <= daysInMonth; day++) {
            const curHDate = new hebcal.HDate(day, hmonth, hyear);
            const gregDate = curHDate.greg();
            const dStr = formatIsoDate(gregDate);
            grid.push({
              dStr,
              primaryLabel: hebrewDayNumeral(day),
              secondaryLabel: formatGregorianShort(gregDate)
            });
          }
          return grid;
        }

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        const grid = [];
        for (let i = 0; i < firstDay; i++) grid.push(null);
        for (let day = 1; day <= totalDays; day++) {
          const formattedMonth = String(month + 1).padStart(2, '0');
          const formattedDay = String(day).padStart(2, '0');
          const dStr = `${year}-${formattedMonth}-${formattedDay}`;
          const hd = new hebcal.HDate(new Date(year, month, day));
          grid.push({
            dStr,
            primaryLabel: String(day),
            secondaryLabel: `${hebrewDayNumeral(hd.getDate())} ${hebrewMonthLabel(hd.getMonth(), hd.getFullYear())}`
          });
        }
        return grid;
      };

      const renderHebrewInfoBadges = (targetDateStr) => {
        const dayInfo = hebrewCalendarInfo[targetDateStr];
        if (!dayInfo || (!dayInfo.parsha && dayInfo.holidays.length === 0)) return null;

        return (
          <div className="flex flex-wrap items-center gap-1.5 mb-2">
            {dayInfo.parsha && (
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                isDarkMode ? 'bg-violet-900/60 text-violet-200 border-violet-700' : 'bg-violet-100 text-violet-800 border-violet-300'
              }`}>
                {dayInfo.parsha}
              </span>
            )}
            {dayInfo.holidays.map((h, idx) => (
              <span key={idx} className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                isDarkMode ? 'bg-amber-900/60 text-amber-200 border-amber-700' : 'bg-amber-100 text-amber-800 border-amber-300'
              }`}>
                {h}
              </span>
            ))}
          </div>
        );
      };

      const renderDayTimeline = (targetDateStr) => {
        const dayEvs = filteredEvents.filter(e => e.date === targetDateStr);

        if (dayEvs.length === 0) {
          return (
            <div className={`text-center py-8 px-4 rounded-2xl border border-dashed ${isDarkMode ? 'bg-slate-800/40 border-slate-700/60' : 'bg-emerald-50/40 border-emerald-200'}`}>
              <i className="fa-regular fa-calendar-check text-2xl text-emerald-500 mb-2 block"></i>
              <p className={`text-xs font-semibold ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>אין אירועים מתוכננים</p>
              <button
                onClick={() => openModalForNew(targetDateStr)}
                className="mt-2 text-xs font-bold text-emerald-600 dark:text-emerald-400 hover:underline transition"
              >
                + הוסף אירוע
              </button>
            </div>
          );
        }

        return (
          <div className="space-y-2.5">
            {dayEvs.map(ev => {
              const displayOwner = ev.owner === 'כללי' ? 'משותף' : ev.owner;
              const style = OWNER_COLORS[displayOwner] || OWNER_COLORS['דודי'];
              const cardClass = isDarkMode ? style.cardDark : style.cardLight;
              const badgeClass = isDarkMode ? style.badgeDark : style.badgeLight;

              return (
                <div
                  key={ev.id}
                  className={`rounded-2xl p-3.5 shadow-sm border transition flex flex-col justify-between gap-2.5 relative overflow-hidden ${cardClass}`}
                >
                  <div className={`absolute top-0 right-0 bottom-0 w-1.5 ${style.bg}`}></div>

                  <div className="flex justify-between items-start pr-2">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeClass}`}>
                          {displayOwner}
                        </span>
                        <span className="text-xs font-semibold opacity-80 flex items-center gap-1">
                          <i className="fa-regular fa-clock text-[10px]"></i>
                          {ev.time} {ev.end_time ? `- ${ev.end_time}` : ''}
                        </span>
                      </div>
                      <h4 className="font-bold text-sm leading-snug">{ev.title}</h4>
                      {ev.description && (
                        <p className="text-xs mt-1 leading-relaxed opacity-90">{ev.description}</p>
                      )}
                    </div>

                    <div className={`flex items-center gap-1 p-1 rounded-xl border ${isDarkMode ? 'bg-slate-900/40 border-slate-700/50 text-slate-300' : 'bg-white/80 border-slate-200/80 text-slate-600'}`}>
                      <button onClick={() => openModalForEdit(ev)} className="w-7 h-7 flex items-center justify-center hover:text-emerald-500 rounded-lg transition">
                        <i className="fa-solid fa-pen text-xs"></i>
                      </button>
                      <button onClick={() => handleDeleteEvent(ev.id)} className="w-7 h-7 flex items-center justify-center hover:text-rose-500 rounded-lg transition">
                        <i className="fa-solid fa-trash text-xs"></i>
                      </button>
                    </div>
                  </div>

                  {ev.location && (
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}`}
                      target="_blank"
                      rel="noreferrer"
                      className={`text-xs font-semibold px-2.5 py-1 rounded-xl inline-flex items-center gap-1.5 w-fit transition mr-2 ${
                        isDarkMode ? 'bg-slate-900/60 hover:bg-slate-900/90' : 'bg-white/90 hover:bg-white'
                      }`}
                    >
                      <i className="fa-solid fa-location-dot text-emerald-500"></i>
                      <span className="truncate max-w-[200px]">{ev.location}</span>

                  <div>
                    <label className={`block text-xs font-bold mb-1 ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>משויך ל:</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['דודי', 'שיינדי', 'משותף'].map((name) => (
                        <button
                          key={name}
                          type="button"
                          onClick={() => setOwner(name)}
                          className={`py-2.5 rounded-xl text-xs font-bold border transition ${
                            owner === name
                              ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm'
                              : isDarkMode
                              ? 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'
                              : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          {name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/30 text-sm active:scale-[0.98] mt-2"
                  >
                    שמור אירוע
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CalendarApp />);
  </script>
</body>
</html>
