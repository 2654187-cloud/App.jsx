<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יומן ניהול לו"ז משפחתי</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Hebcal (לוח עברי) -->
  <script src="https://cdn.jsdelivr.net/npm/hebcal@2.3.2/client/hebcal.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font Awesome (אייקונים של חיצים, מצב תאורה/כפתורים) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- גופן Assistant -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Assistant', sans-serif; transition: background-color 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 999px; }
  </style>
</head>
<body class="antialiased min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- הגדרות חיבור ל-SUPABASE ---
    const SUPABASE_URL = 'https://thnfcunjgodtkcuugbfg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FIo2bDyuizlE6cPf9HzMkw_r621ajwI';
    const CITY_NAME = 'Ashdod';

    const supabase = (window.supabase && window.supabase.createClient) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
      : null;

    // --- פונקציות עזר לתאריכים עבריים ---
    function getHebrewInfo(dateObj) {
      if (!window.hebcal) return { dayStr: '', monthName: '', yearStr: '', fullStr: '' };
      try {
        const { HDate, gematriya } = window.hebcal;
        const hdate = new HDate(dateObj);
        const monthNum = hdate.getMonth();
        const isLeap = hdate.isLeapYear();

        const monthNames = {
          1: 'ניסן', 2: 'אייר', 3: 'סיון', 4: 'תמוז', 5: 'אב', 6: 'אלול',
          7: 'תשרי', 8: 'חשוון', 9: 'כסלו', 10: 'טבת', 11: 'שבט', 12: 'אדר',
          13: 'אדר ב\'', 14: 'אדר א\''
        };

        let monthName = monthNames[monthNum] || hdate.getMonthName();
        if (isLeap && monthNum === 12) monthName = 'אדר א\'';
        if (isLeap && monthNum === 13) monthName = 'אדר ב\'';

        const dayStr = gematriya(hdate.getDate());
        const yearStr = gematriya(hdate.getFullYear());

        return {
          dayStr,
          monthName,
          yearStr,
          fullStr: `${dayStr} ב${monthName} ${yearStr}`
        };
      } catch (e) {
        return { dayStr: '', monthName: '', yearStr: '', fullStr: '' };
      }
    }

    function CalendarApp() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month'); // 'month', 'week', 'day'
      const [calendarType, setCalendarType] = useState('gregorian'); // 'gregorian', 'hebrew'
      const [filterOwner, setFilterOwner] = useState('הכול');
      const [theme, setTheme] = useState('light');
      const [events, setEvents] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [newEvent, setNewEvent] = useState({
        title: '',
        date: new Date().toISOString().split('T')[0],
        owner: 'משותף',
        time: '10:00'
      });

      // טעינת מצב תאורה
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      // טעינת אירועים מ-Supabase
      useEffect(() => {
        fetchEvents();
      }, []);

      async function fetchEvents() {
        if (!supabase) return;
        const { data, error } = await supabase.from('events').select('*');
        if (!error && data) {
          setEvents(data);
        }
      }

      async function handleAddEvent(e) {
        e.preventDefault();
        if (!newEvent.title) return;

        if (supabase) {
          const { error } = await supabase.from('events').insert([
            {
              title: newEvent.title,
              date: newEvent.date,
              owner: newEvent.owner,
              time: newEvent.time
            }
          ]);
          if (error) alert("שגיאה בשמירה: " + error.message);
        } else {
          setEvents([...events, { ...newEvent, id: Date.now() }]);
        }

        setShowModal(false);
        setNewEvent({ title: '', date: new Date().toISOString().split('T')[0], owner: 'משותף', time: '10:00' });
        fetchEvents();
      }

      // ניווט תאריכים
      const handlePrev = () => {
        const d = new Date(currentDate);
        if (viewMode === 'month') d.setMonth(d.getMonth() - 1);
        else if (viewMode === 'week') d.setDate(d.getDate() - 7);
        else d.setDate(d.getDate() - 1);
        setCurrentDate(d);
      };

      const handleNext = () => {
        const d = new Date(currentDate);
        if (viewMode === 'month') d.setMonth(d.getMonth() + 1);
        else if (viewMode === 'week') d.setDate(d.getDate() + 7);
        else d.setDate(d.getDate() + 1);
        setCurrentDate(d);
      };

      const handleToday = () => setCurrentDate(new Date());

      // סינון אירועים לפי בעלים
      const filteredEvents = events.filter(e => filterOwner === 'הכול' || e.owner === filterOwner);

      const getOwnerBadge = (owner) => {
        switch (owner) {
          case 'דודי': return 'bg-emerald-500 text-white';
          case 'שיינדי': return 'bg-rose-500 text-white';
          case 'כללי': return 'bg-purple-500 text-white';
          default: return 'bg-teal-600 text-white';
        }
      };

      const daysOfWeek = ['א\'', 'ב\'', 'ג\'', 'ד\'', 'ה\'', 'ו\'', 'ש\''];

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6">
          {/* סרגל עליון */}
          <header className="flex flex-wrap justify-between items-center gap-4 mb-6 bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center text-white font-black text-xl shadow-md">
                📅
              </div>
              <div>
                <h1 className="text-xl md:text-2xl font-bold">יומן משפחתי</h1>
                <p className="text-xs text-slate-400">ניהול לו"ז בזמן אמת | {getHebrewInfo(new Date()).fullStr}</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {/* כפתור מצב בהיר/כהה */}
              <button
                onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                className="w-10 h-10 rounded-2xl border border-slate-300 dark:border-slate-600 flex items-center justify-center text-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                title="החלף מצב תאורה"
              >
                <i className={theme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun text-amber-400'}></i>
              </button>

              {/* כפתור אירוע חדש */}
              <button
                onClick={() => setShowModal(true)}
                className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-md shadow-emerald-500/20 transition-all flex items-center gap-2"
              >
                <i className="fa-solid fa-plus"></i>
                <span>אירוע</span>
              </button>
            </div>
          </header>

          {/* סרגל סינון בעלי אירוע */}
          <div className="bg-white dark:bg-slate-800 p-1.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4 flex justify-between gap-1">
            {['הכול', 'דודי', 'שיינדי', 'משותף'].map((owner) => (
              <button
                key={owner}
                onClick={() => setFilterOwner(owner)}
                className={`flex-1 py-2 rounded-xl text-sm font-bold transition-all ${
                  filterOwner === owner
                    ? 'bg-emerald-500 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                {owner}
              </button>
            ))}
          </div>

          {/* סרגל ניווט תאריכים ותצוגה */}
          <div className="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-2">
              <button
                onClick={handleToday}
                className="px-4 py-2 bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 rounded-xl font-bold text-sm"
              >
                היום
              </button>

              <button
                onClick={handlePrev}
                className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
              >
                <i className="fa-solid fa-chevron-right"></i>
              </button>

              <div className="flex items-center gap-2 px-2">
                <span className="text-lg md:text-xl font-black">
                  {currentDate.toLocaleString('he-IL', { month: 'long' })} {currentDate.getFullYear()}
                </span>
              </div>

              <button
                onClick={handleNext}
                className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
              >
                <i className="fa-solid fa-chevron-left"></i>
              </button>
            </div>

            {/* מתג לוח עברי / לועזי */}
            <div className="flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-xl">
              <button
                onClick={() => setCalendarType('gregorian')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                  calendarType === 'gregorian' ? 'bg-white dark:bg-slate-800 shadow-sm text-emerald-600 dark:text-emerald-400' : 'text-slate-400'
                }`}
              >
                לועזי
              </button>
              <button
                onClick={() => setCalendarType('hebrew')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                  calendarType === 'hebrew' ? 'bg-white dark:bg-slate-800 shadow-sm text-emerald-600 dark:text-emerald-400' : 'text-slate-400'
                }`}
              >
                עברי
              </button>
            </div>

            {/* מצב תצוגה */}
            <div className="flex items-center bg-slate-100 dark:bg-slate-700 p-1 rounded-xl">
              {['חודש', 'שבוע', 'יום'].map((mode, idx) => {
                const keys = ['month', 'week', 'day'];
                return (
                  <button
                    key={mode}
                    onClick={() => setViewMode(keys[idx])}
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      viewMode === keys[idx]
                        ? 'bg-emerald-500 text-white shadow-sm'
                        : 'text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                    }`}
                  >
                    {mode}
                  </button>
                );
              })}
            </div>
          </div>

          {/* לוח שנה - תצוגת חודש */}
          <div className="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
            {/* ימי השבוע */}
            <div className="grid grid-cols-7 gap-2 mb-3 text-center font-bold text-slate-400 text-sm">
              {daysOfWeek.map((day) => (
                <div key={day} className="py-2">{day}</div>
              ))}
            </div>

            {/* רשת הימים */}
            <div className="grid grid-cols-7 gap-2">
              {(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDayIndex = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const grid = [];

                for (let i = 0; i < firstDayIndex; i++) {
                  grid.push(<div key={`empty-${i}`} className="h-24 md:h-28 bg-slate-50/50 dark:bg-slate-900/30 rounded-2xl border border-slate-100 dark:border-slate-800 opacity-40"></div>);
                }

                for (let d = 1; d <= daysInMonth; d++) {
                  const dateObj = new Date(year, month, d);
                  const isoDate = dateObj.toISOString().split('T')[0];
                  const hInfo = getHebrewInfo(dateObj);
                  const dayEvents = filteredEvents.filter(e => e.date === isoDate);
                  const isToday = isoDate === new Date().toISOString().split('T')[0];

                  grid.push(
                    <div
                      key={isoDate}
                      className={`h-24 md:h-28 p-2 rounded-2xl border transition-all flex flex-col justify-between ${
                        isToday
                          ? 'border-emerald-500 bg-emerald-50/30 dark:bg-emerald-950/20 shadow-sm'
                          : 'border-slate-100 dark:border-slate-700/60 bg-slate-50/30 dark:bg-slate-800/50 hover:border-slate-300'
                      }`}
                    >
                      <div className="flex justify-between items-center">
                        <span className={`font-bold text-sm md:text-base ${isToday ? 'text-emerald-600 dark:text-emerald-400 font-extrabold' : ''}`}>
                          {calendarType === 'hebrew' ? hInfo.dayStr || d : d}
                        </span>
                        <span className="text-[10px] text-slate-400 font-medium">
                          {calendarType === 'hebrew' ? `${d}/${month + 1}` : hInfo.dayStr}
                        </span>
                      </div>

                      <div className="flex-1 overflow-y-auto my-1 flex flex-col gap-1">
                        {dayEvents.map((evt, idx) => (
                          <div
                            key={idx}
                            className={`text-[10px] p-1 rounded-lg font-bold truncate ${getOwnerBadge(evt.owner)}`}
                          >
                            {evt.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                }

                return grid;
              })()}
            </div>
          </div>

          {/* מודל הוספת אירוע */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-xl font-bold mb-4">אירוע חדש</h3>
                <form onSubmit={handleAddEvent} className="flex flex-col gap-4">
                  <div>
                    <label className="text-xs text-slate-400 mb-1 block font-bold">שם האירוע</label>
                    <input
                      type="text"
                      required
                      value={newEvent.title}
                      onChange={(e) => setNewEvent({ ...newEvent, title: e.target.value })}
                      className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 outline-none focus:border-emerald-500"
                      placeholder="הכנס שם אירוע..."
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 mb-1 block font-bold">תאריך</label>
                    <input
                      type="date"
                      required
                      value={newEvent.date}
                      onChange={(e) => setNewEvent({ ...newEvent, date: e.target.value })}
                      className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 mb-1 block font-bold">שיוך</label>
                    <select
                      value={newEvent.owner}
                      onChange={(e) => setNewEvent({ ...newEvent, owner: e.target.value })}
                      className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 outline-none focus:border-emerald-500"
                    >
                      <option value="משותף">משותף 🤝</option>
                      <option value="דודי">דודי 👨</option>
                      <option value="שיינדי">שיינדי 👩</option>
                      <option value="כללי">כללי 📌</option>
                    </select>
                  </div>

                  <div className="flex justify-end gap-3 mt-4">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-bold"
                    >
                      ביטול
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-500 text-white rounded-xl text-sm font-bold shadow-md shadow-emerald-500/20"
                    >
                      שמור אירוע
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<CalendarApp />, document.getElementById('root'));
  </script>
</body>
</html>
