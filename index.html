<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>היומן המשותף</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // --- הגדרות חיבור ל-SUPABASE ---
        const SUPABASE_URL = 'https://thnfcunjgodtkuugbfg.supabase.co';
        const SUPABASE_ANON_KEY = 'הדבק_כאן_את_המפתח_מ-Publishable_key';
        const CITY_NAME = 'Ashdod';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function CalendarApp() {
            const [currentDate, setCurrentDate] = React.useState(new Date());
            const [selectedDayData, setSelectedDayData] = React.useState(null);
            const [dayTimes, setDayTimes] = React.useState({});
            const [activeFilter, setActiveFilter] = React.useState('all');
            const [events, setEvents] = React.useState([]);

            // Form states
            const [newTitle, setNewTitle] = React.useState('');
            const [itemType, setItemType] = React.useState('event'); // event | meeting | task
            const [isAllDay, setIsAllDay] = React.useState(true);
            const [startTime, setStartTime] = React.useState('');
            const [endTime, setEndTime] = React.useState('');
            const [location, setLocation] = React.useState('');
            const [newOwner, setNewOwner] = React.useState('dudi');

            // Today's date comparison string (YYYY-MM-DD)
            const todayObj = new Date();
            const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

            // Roll over uncompleted tasks to today
            const rolloverUncompletedTasks = async (fetchedEvents) => {
                const overdueTasks = fetchedEvents.filter(e => 
                    e.category === 'task' && 
                    !e.is_completed && 
                    e.date < todayStr
                );

                if (overdueTasks.length > 0) {
                    for (let task of overdueTasks) {
                        await supabase.from('events').update({ date: todayStr }).eq('id', task.id);
                    }
                    fetchEvents();
                }
            };

            const fetchEvents = async () => {
                const { data, error } = await supabase.from('events').select('*');
                if (!error && data) {
                    setEvents(data);
                    rolloverUncompletedTasks(data);
                }
            };

            React.useEffect(() => {
                fetchEvents();
            }, []);

            React.useEffect(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                fetch(`https://www.hebcal.com/zmanim?cfg=json&city=${CITY_NAME}&month=${year}-${month}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.times) setDayTimes(data.times);
                    })
                    .catch(err => console.error('Error fetching times:', err));
            }, [currentDate]);

            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const firstDayOfWeek = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();

            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

            const filteredEvents = events.filter(ev => {
                if (activeFilter === 'all') return true;
                return ev.owner === activeFilter;
            });

            const toggleTaskCompletion = async (eventId, currentStatus) => {
                const { error } = await supabase.from('events').update({ is_completed: !currentStatus }).eq('id', eventId);
                if (!error) fetchEvents();
            };

            const handleAddEvent = async (e) => {
                e.preventDefault();
                if (!newTitle.trim() || !selectedDayData) return;

                const timeDisplay = isAllDay ? 'כל היום' : `${startTime}${endTime ? ' - ' + endTime : ''}`;

                const newEvent = {
                    title: newTitle,
                    date: selectedDayData.dateStr,
                    time: timeDisplay,
                    owner: newOwner,
                    category: itemType,
                    location: location || null,
                    is_completed: false
                };

                const { data, error } = await supabase.from('events').insert([newEvent]).select();
                if (!error) {
                    fetchEvents();
                    setNewTitle('');
                    setLocation('');
                    setStartTime('');
                    setEndTime('');
                    setIsAllDay(true);
                } else {
                    alert('שגיאה בשמירה. ודא כי הטבלה ב-Supabase מעודכנת');
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans pb-10">
                    {/* Header */}
                    <div className="bg-white p-4 shadow-sm border-b sticky top-0 z-10 flex flex-col gap-3">
                        <div className="flex justify-between items-center">
                            <button onClick={prevMonth} className="p-2 bg-slate-100 rounded-lg text-slate-600 font-bold">◀</button>
                            <h1 className="text-xl font-bold text-slate-800">
                                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                            </h1>
                            <button onClick={nextMonth} className="p-2 bg-slate-100 rounded-lg text-slate-600 font-bold">▶</button>
                        </div>

                        {/* Filter Tabs */}
                        <div className="flex justify-around bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                            <button 
                                onClick={() => setActiveFilter('all')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'all' ? 'bg-slate-800 text-white shadow' : 'text-slate-600'}`}>
                                הכל
                            </button>
                            <button 
                                onClick={() => setActiveFilter('dudi')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'dudi' ? 'bg-blue-600 text-white shadow' : 'text-slate-600'}`}>
                                דודי
                            </button>
                            <button 
                                onClick={() => setActiveFilter('wife')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'wife' ? 'bg-purple-600 text-white shadow' : 'text-slate-600'}`}>
                                שיינדי
                            </button>
                            <button 
                                onClick={() => setActiveFilter('shared')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'shared' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>
                                משותף
                            </button>
                        </div>
                    </div>

                    {/* Days Header */}
                    <div className="grid grid-cols-7 gap-1 p-2 text-center text-xs font-bold text-slate-400 border-b bg-white">
                        <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
                    </div>

                    {/* Calendar Grid */}
                    <div className="grid grid-cols-7 gap-1 p-2 flex-grow">
                        {Array.from({ length: firstDayOfWeek }).map((_, i) => (
                            <div key={`empty-${i}`} className="h-20 bg-transparent"></div>
                        ))}

                        {Array.from({ length: daysInMonth }).map((_, i) => {
                            const dayNum = i + 1;
                            const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                            const dayEvents = filteredEvents.filter(e => e.date === dateStr);
                            const sunsetTime = dayTimes[dateStr] || dayTimes[`${dateStr}T00:00:00`]?.[0];
                            const isToday = dateStr === todayStr;

                            return (
                                <div 
                                    key={dayNum} 
                                    onClick={() => setSelectedDayData({ dayNum, dateStr, events: dayEvents })}
                                    className={`h-20 rounded-lg p-1 border flex flex-col justify-between shadow-sm cursor-pointer active:scale-95 transition ${
                                        isToday 
                                            ? 'bg-amber-50 border-amber-300 ring-1 ring-amber-300' 
                                            : 'bg-white border-slate-100'
                                    }`}>
                                    
                                    <div className="flex justify-between items-center">
                                        <span className={`text-xs font-bold px-1 rounded ${isToday ? 'bg-amber-400 text-slate-900' : 'text-slate-700'}`}>
                                            {dayNum}
                                        </span>
                                    </div>
                                    
                                    <div className="flex flex-col gap-0.5 overflow-hidden">
                                        {dayEvents.slice(0, 2).map((ev, idx) => (
                                            <div 
                                                key={idx} 
                                                className={`text-[9px] px-1 rounded truncate text-white ${
                                                    ev.is_completed ? 'line-through opacity-50 bg-slate-400' :
                                                    ev.owner === 'dudi' ? 'bg-blue-500' :
                                                    ev.owner === 'wife' ? 'bg-purple-500' : 'bg-emerald-500'
                                                }`}>
                                                {ev.category === 'task' ? '☑ ' : ev.category === 'meeting' ? '🤝 ' : ''}{ev.title}
                                            </div>
                                        ))}
                                        {dayEvents.length > 2 && (
                                            <span className="text-[8px] text-slate-400 font-bold">+{dayEvents.length - 2} נוספים</span>
                                        )}
                                    </div>

                                    {sunsetTime && (
                                        <div className="text-[8px] text-amber-600 font-medium">
                                            🌅 {new Date(sunsetTime).toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal for Day Details & Add Item */}
                    {selectedDayData && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-end justify-center z-50">
                            <div className="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-lg text-slate-800">תכנון ל-{selectedDayData.dateStr}</h3>
                                    <button onClick={() => setSelectedDayData(null)} className="text-slate-400 font-bold text-xl">✕</button>
                                </div>

                                {/* List Items */}
                                <div className="flex flex-col gap-2">
                                    {events.filter(e => e.date === selectedDayData.dateStr).length === 0 ? (
                                        <p className="text-sm text-slate-400 text-center py-2">אין אירועים או משימות ליום זה</p>
                                    ) : (
                                        events.filter(e => e.date === selectedDayData.dateStr).map((ev, idx) => (
                                            <div key={idx} className="p-3 rounded-xl bg-slate-50 border flex justify-between items-center">
                                                <div className="flex items-center gap-2">
                                                    {ev.category === 'task' && (
                                                        <input 
                                                            type="checkbox" 
                                                            checked={ev.is_completed || false} 
                                                            onChange={() => toggleTaskCompletion(ev.id, ev.is_completed)}
                                                            className="w-4 h-4 rounded text-blue-600"
                                                        />
                                                    )}
                                                    <div>
                                                        <p className={`font-semibold text-sm text-slate-800 ${ev.is_completed ? 'line-through text-slate-400' : ''}`}>
                                                            {ev.title}
                                                        </p>
                                                        <p className="text-xs text-slate-400">
                                                            {ev.time} • {ev.owner === 'dudi' ? 'דודי' : ev.owner === 'wife' ? 'שיינדי' : 'משותף'}
                                                            {ev.location && ` • 📍 ${ev.location}`}
                                                        </p>
                                                    </div>
                                                </div>
                                                <span className="text-xs px-2 py-0.5 rounded bg-slate-200 text-slate-600">
                                                    {ev.category === 'task' ? 'משימה' : ev.category === 'meeting' ? 'פגישה' : 'אירוע'}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Add Form */}
                                <form onSubmit={handleAddEvent} className="border-t pt-3 flex flex-col gap-3">
                                    <h4 className="font-bold text-sm text-slate-700">הוספה חדשה</h4>
                                    
                                    {/* Item Type Selector */}
                                    <div className="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold">
                                        <button 
                                            type="button"
                                            onClick={() => setItemType('event')}
                                            className={`flex-1 py-1 rounded-md ${itemType === 'event' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}>
                                            אירוע
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => setItemType('meeting')}
                                            className={`flex-1 py-1 rounded-md ${itemType === 'meeting' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}>
                                            פגישה
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => setItemType('task')}
                                            className={`flex-1 py-1 rounded-md ${itemType === 'task' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}>
                                            משימה
                                        </button>
                                    </div>

                                    <input 
                                        type="text" 
                                        placeholder="כותרת" 
                                        value={newTitle} 
                                        onChange={(e) => setNewTitle(e.target.value)}
                                        className="w-full p-2 text-sm border rounded-lg focus:outline-none"
                                        required
                                    />

                                    {/* Time selection */}
                                    <div className="flex flex-col gap-2 bg-slate-50 p-2 rounded-lg border">
                                        <label className="flex items-center gap-2 text-xs text-slate-600 font-bold cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={isAllDay} 
                                                onChange={(e) => setIsAllDay(e.target.checked)} 
                                            />
                                            כל היום
                                        </label>
                                        {!isAllDay && (
                                            <div className="flex gap-2">
                                                <input 
                                                    type="time" 
                                                    value={startTime} 
                                                    onChange={(e) => setStartTime(e.target.value)} 
                                                    className="flex-1 p-1.5 text-xs border rounded bg-white"
                                                    required
                                                />
                                                <span className="text-xs self-center">עד</span>
                                                <input 
                                                    type="time" 
                                                    value={endTime} 
                                                    onChange={(e) => setEndTime(e.target.value)} 
                                                    className="flex-1 p-1.5 text-xs border rounded bg-white"
                                                />
                                            </div>
                                        )}
                                    </div>

                                    <input 
                                        type="text" 
                                        placeholder="מיקום (אופציונלי)" 
                                        value={location} 
                                        onChange={(e) => setLocation(e.target.value)}
                                        className="w-full p-2 text-sm border rounded-lg focus:outline-none"
                                    />

                                    <select 
                                        value={newOwner} 
                                        onChange={(e) => setNewOwner(e.target.value)}
                                        className="w-full p-2 text-sm border rounded-lg focus:outline-none bg-white">
                                        <option value="dudi">דודי</option>
                                        <option value="wife">שיינדי</option>
                                        <option value="shared">משותף</option>
                                    </select>

                                    <button 
                                        type="submit" 
                                        className="w-full py-2 bg-slate-800 text-white text-sm font-bold rounded-lg shadow active:scale-95 transition">
                                        שמור
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CalendarApp />);
    </script>
</body>
</html>
