<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>היומן המשותף</title>

    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="היומן המשותף">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f8fafc">
    <link rel="manifest" href='data:application/json,{"name":"היומן המשותף","short_name":"יומן","start_url":"/","display":"standalone","background_color":"#f8fafc","theme_color":"#f8fafc"}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel compiler for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // --- הגדרות חיבור ל-SUPABASE ---
        const SUPABASE_URL = 'https://thnfcunjgodtkuugbfg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FIo2bDyuizlE6cPf9HzMkw_r621ajwI';
        const CITY_NAME = 'Ashdod';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function CalendarApp() {
            const [currentDate, setCurrentDate] = React.useState(new Date());
            const [selectedDayData, setSelectedDayData] = React.useState(null);
            const [dayTimes, setDayTimes] = React.useState({});
            const [activeFilter, setActiveFilter] = React.useState('all');
            const [events, setEvents] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            // Fetch events from Supabase
            const fetchEvents = async () => {
                setIsLoading(true);
                const { data, error } = await supabase.from('events').select('*');
                if (error) {
                    console.error('Error fetching events:', error);
                } else {
                    setEvents(data || []);
                }
                setIsLoading(false);
            };

            React.useEffect(() => {
                fetchEvents();
            }, []);

            // Fetch Sunset times from Hebcal API
            React.useEffect(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                fetch(`https://www.hebcal.com/zmanim?cfg=json&city=${CITY_NAME}&month=${year}-${month}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.times) {
                            setDayTimes(data.times);
                        }
                    })
                    .catch(err => console.error('Error fetching times:', err));
            }, [currentDate]);

            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const firstDayOfWeek = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();

            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

            const filteredEvents = events.filter(ev => {
                if (activeFilter === 'all') return true;
                return ev.owner === activeFilter;
            });

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col font-sans pb-10">
                    {/* Header */}
                    <div className="bg-white p-4 shadow-sm border-b sticky top-0 z-10 flex flex-col gap-3">
                        <div className="flex justify-between items-center">
                            <button onClick={prevMonth} className="p-2 bg-slate-100 rounded-lg text-slate-600 font-bold">◀</button>
                            <h1 className="text-xl font-bold text-slate-800">
                                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                            </h1>
                            <button onClick={nextMonth} className="p-2 bg-slate-100 rounded-lg text-slate-600 font-bold">▶</button>
                        </div>

                        {/* Filter Tabs */}
                        <div className="flex justify-around bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                            <button 
                                onClick={() => setActiveFilter('all')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'all' ? 'bg-slate-800 text-white shadow' : 'text-slate-600'}`}>
                                הכל
                            </button>
                            <button 
                                onClick={() => setActiveFilter('dudi')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'dudi' ? 'bg-blue-600 text-white shadow' : 'text-slate-600'}`}>
                                דודי
                            </button>
                            <button 
                                onClick={() => setActiveFilter('wife')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'wife' ? 'bg-purple-600 text-white shadow' : 'text-slate-600'}`}>
                                אשתי
                            </button>
                            <button 
                                onClick={() => setActiveFilter('shared')}
                                className={`flex-1 py-1.5 rounded-lg transition ${activeFilter === 'shared' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>
                                משותף
                            </button>
                        </div>
                    </div>

                    {/* Days Header */}
                    <div className="grid grid-cols-7 gap-1 p-2 text-center text-xs font-bold text-slate-400 border-b bg-white">
                        <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
                    </div>

                    {/* Calendar Grid */}
                    <div className="grid grid-cols-7 gap-1 p-2 flex-grow">
                        {Array.from({ length: firstDayOfWeek }).map((_, i) => (
                            <div key={`empty-${i}`} className="h-20 bg-transparent"></div>
                        ))}

                        {Array.from({ length: daysInMonth }).map((_, i) => {
                            const dayNum = i + 1;
                            const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                            const dayEvents = filteredEvents.filter(e => e.date === dateStr);

                            return (
                                <div 
                                    key={dayNum} 
                                    onClick={() => setSelectedDayData({ dayNum, dateStr, events: dayEvents })}
                                    className="h-20 bg-white rounded-lg p-1 border border-slate-100 flex flex-col justify-between shadow-sm cursor-pointer active:scale-95 transition">
                                    <span className="text-xs font-bold text-slate-700">{dayNum}</span>
                                    
                                    <div className="flex flex-col gap-0.5 overflow-hidden">
                                        {dayEvents.slice(0, 2).map((ev, idx) => (
                                            <div 
                                                key={idx} 
                                                className={`text-[9px] px-1 rounded truncate text-white ${
                                                    ev.owner === 'dudi' ? 'bg-blue-500' :
                                                    ev.owner === 'wife' ? 'bg-purple-500' : 'bg-emerald-500'
                                                }`}>
                                                {ev.title}
                                            </div>
                                        ))}
                                        {dayEvents.length > 2 && (
                                            <span className="text-[8px] text-slate-400 font-bold">+{dayEvents.length - 2} נוספים</span>
                                        )}
                                    </div>

                                    {/* Sunset indicator */}
                                    <div className="text-[8px] text-amber-600 font-medium">
                                        🌅 {dayTimes[dateStr] ? new Date(dayTimes[dateStr]).toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'}) : '--:--'}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Modal for Day Details / Add Event */}
                    {selectedDayData && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-end justify-center z-50">
                            <div className="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl flex flex-col gap-4 max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-lg text-slate-800">אירועים ל-{selectedDayData.dateStr}</h3>
                                    <button onClick={() => setSelectedDayData(null)} className="text-slate-400 font-bold text-xl">✕</button>
                                </div>

                                <div className="flex flex-col gap-2">
                                    {selectedDayData.events.length === 0 ? (
                                        <p className="text-sm text-slate-400 text-center py-4">אין אירועים ליום זה</p>
                                    ) : (
                                        selectedDayData.events.map((ev, idx) => (
                                            <div key={idx} className="p-3 rounded-xl bg-slate-50 border flex justify-between items-center">
                                                <div>
                                                    <p className="font-semibold text-sm text-slate-800">{ev.title}</p>
                                                    <p className="text-xs text-slate-400">{ev.time || 'כל היום'} • {ev.owner}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CalendarApp />);
    </script>
</body>
</html>
